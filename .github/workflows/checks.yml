name: Checks

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The jobs are read from the flake, so that a new check or test needs no change here, and each
  # is named after what it does, so that the pull request names each failure: check-<name> runs a
  # check of the repository, test-<module> builds the tests of a module, and lint builds the lint
  # of every command of devkit's own flake, whose scripts depend on all its modules together.
  list:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # 31.11.3
      - id: list
        name: List the jobs
        run: |
          apps=$(nix eval --json .#apps.x86_64-linux --apply builtins.attrNames)
          checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          jq -nr --argjson apps "$apps" --argjson checks "$checks" '
            "matrix=" + ({
              include: (
                [$apps[] | select(startswith("check-")) | {name: ., run: .}]
                + [$checks[] | select(startswith("lint-") | not) | {name: ., build: [.]}]
                + [{name: "lint", build: [$checks[] | select(startswith("lint-"))]}]
              )
            } | tojson)
          ' >>"$GITHUB_OUTPUT"

  check:
    needs: list
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # 31.11.3
      - if: matrix.run
        name: Run the check
        run: nix run --quiet ".#$RUN"
        env:
          RUN: ${{ matrix.run }}
      # --keep-going builds every flake check after a failure too, so that the job reports them all.
      - if: matrix.build
        name: Build the flake checks
        run: |
          mapfile -t attributes < <(jq -r '.[] | ".#checks.x86_64-linux." + .' <<<"$BUILD")
          nix build --quiet --keep-going --no-link "${attributes[@]}"
        env:
          BUILD: ${{ toJSON(matrix.build) }}

  # The main branch's ruleset requires only this job, so that a new check needs no ruleset change.
  # It always runs, because a skipped job would count as passed.
  checks:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.check.result }}
